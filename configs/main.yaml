mode: standard
results_dir: results/main

# This file is a safe default. After pilot, prefer:
#   python run_experiment.py --config results/pilot/best_config.yaml --seeds 0 1 2 3 4 --results_dir results/main
p: 47
train_fraction: 0.4
seeds: [0, 1, 2, 3, 4]
model_type: quadratic
hidden_width: 256
lr: 0.003
weight_decay: 1.0
init_scale: 0.7
max_steps: 30000
batch_size: full

checkpoint_preset: main
compute_agop: true
compute_ntk: true
save_final_model: true

agop_batch_size: 128
agop_probe_size: full
agop_exact_p_max: 47
ntk_probe_size: 128
fourier_K: [1, 2, 4, 8, 16]
random_alignment: true
